name = "personal-ai"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true
# fetch() always goes over the public internet (also for hosts on this
# account), which keeps fetch_url/provider calls away from internal routes
# and lets a provider or MCP server hosted on another Worker be reached.
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

[vars]
# APP_ORIGIN is optional. Set it after binding a custom domain, e.g.
# APP_ORIGIN = "https://ai.example.com"
SESSION_DAYS = "30"

# D1 is REQUIRED: settings, encrypted provider keys, memory, projects and
# files all live there. Create the database, paste its ID below, then deploy.
# The Worker creates/upgrades its tables on the first request; you can also
# apply migrations/ explicitly (see README).
#   npx wrangler d1 create personal-ai
[[d1_databases]]
binding = "DB"
database_name = "personal-ai"
database_id = "PASTE_DATABASE_ID_HERE"
migrations_dir = "migrations"

# Secrets (never put these in this file). These are the ONLY two:
#   npx wrangler secret put APP_PASSWORD
#   npx wrangler secret put AUTH_SECRET   # >= 32 random chars; also derives the key that encrypts API keys in D1
# Provider keys, Tavily/Jina keys and MCP tokens are entered in the UI and
# stored AES-GCM encrypted in D1.
